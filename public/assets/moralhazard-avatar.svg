<?xml version="1.0" encoding="UTF-8"?>
<svg id="MoralHazard-Symbol-" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 512 512">
  <defs>
    <style>

      .isStroke {
        fill: none;
      }

      .strokeLine {
        stroke-miterlimit: 12.8;
        stroke-width: 12px;
        stroke-dasharray: 200 200;
        animation-name: distributions;
        animation-duration: 10s;
        animation-timing-function linear: 
        animation-delay: 0s;
        animation-direction: reverse; 
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      .strokeDashed {
        stroke-dasharray: 15 10;
        stroke-miterlimit: 10;
        stroke-width: 10px;

        animation-name: streams;
        animation-duration: 1s;
        animation-timing-function linear: 
        animation-delay: 0s;
        animation-direction: reverse; 
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      .strokeBlack {
        stroke: #000000;
      }

      .fillBlack {
        fill: #000000;
      }

      .fillWhite {
        fill: #FFFFFF;
      }

      #BigCircleCut-Black,
      #SmallCircleCut-Black {
        animation-delay: 0s;
        animation-direction: alternate; 
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
        transform-origin: center;      
      }

      #BigCircleCut-Black {
        animation-name: bigCircleBlack;
        animation-duration: 5s;
      }

      #SmallCircleCut-Black {
        animation-name: smallCircleBlack;
        animation-duration: 7s;
      }

      #DistributionLine-Top {
        animation-delay: 0s;
      }

      #DistribtuionLine-Middle {
        animation-delay: 0.25s;
      }

      #DistributionLine-Down {
        animation-delay: 0.5s;
      }     

      #StreamLine-Top {
        animation-delay: 0s;
      }

      #StreamLine-Middle {
        animation-delay: 0.25s;
      }

      #StreamLine-Down {
        animation-delay: 0.5s;
      }     


      @keyframes streams {
        0% {
          stroke-dashoffset: 0;
        }
      
        100% {
          stroke-dashoffset: 100;
        }
      }


      @keyframes distributions {
        0% {
          stroke-dashoffset: 0;
        }

        70% {
          stroke-dashoffset: 0;
        }
        90% {
          stroke-dashoffset: 400;
        }
        100% {
          stroke-dashoffset: 400;
        }
      }

      @keyframes bigCircleBlack {
        0% {
          transform: rotateZ(-15deg);
        }
        0% {
          transform: rotateZ(5deg);
        }
        0% {
          transform: rotateZ(-7deg);
        }      
        100% {
          transform: rotateZ(15deg);       
        }
      }

      @keyframes smallCircleBlack {
        0% {
          transform: rotateZ(4deg);
        }
        0% {
          transform: rotateZ(-7deg);
        }
        0% {
          transform: rotateZ(3deg);
        }      
        100% {
          transform: rotateZ(0deg);       
        }
      }






      #MoralHazard-Symbol-Gr {

      }

      #OuterRing-Black {
      }


      #OuterRing-White {
      }


      #BigCircle-White {
      }

  
      #SmallCircle-White {
      }

  


      #Item-Down,
      #Item-Middle,
      #Item-Top {

      }


      #BadStreamSpot-Top,
      #BadStreamSpot-Middle,
      #BadStreamSpot-Down {
      }

      #DistributionLine-Top,
      #DistribtuionLine-Middle,
      #DistributionLine-Down {
      }

      #StreamLine-Top,
      #StreamLine-Middle,
      #StreamLine-Down {
      }

    </style>
  </defs>
